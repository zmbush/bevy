[package]
description = "Provides windowing functionality for Bevy Engine"
edition = "2021"
homepage = "https://bevyengine.org"
keywords = ["bevy"]
license = "MIT OR Apache-2.0"
name = "bevy_window"
repository = "https://github.com/bevyengine/bevy"
version = "0.14.2"

[features]
default = []
serialize = ["bevy_ecs/serialize", "serde", "smol_str/serde"]

[dependencies]
# bevy
bevy_a11y = { version = "0.14.2" }
bevy_app = { version = "0.14.2" }
bevy_ecs = { version = "0.14.2" }
bevy_math = { version = "0.14.2" }
bevy_reflect = { version = "0.14.2", features = ["glam", "smol_str"] }
bevy_utils = { version = "0.14.2" }

# other
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"], optional = true }
smol_str = "0.2"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "-Zunstable-options", "docsrs"]
