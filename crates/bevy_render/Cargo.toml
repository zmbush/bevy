[package]
description = "Provides rendering functionality for Bevy Engine"
edition = "2021"
homepage = "https://bevyengine.org"
keywords = ["bevy"]
license = "MIT OR Apache-2.0"
name = "bevy_render"
repository = "https://github.com/bevyengine/bevy"
version = "0.14.2"

[features]
bmp = ["image/bmp"]
dds = ["ddsfile"]
exr = ["image/exr"]
hdr = ["image/hdr"]
jpeg = ["image/jpeg"]
multi_threaded = ["bevy_tasks/multi_threaded"]
png = ["image/png"]
pnm = ["image/pnm"]
tga = ["image/tga"]
webp = ["image/webp"]

shader_format_glsl = ["naga/glsl-in", "naga/wgsl-out", "naga_oil/glsl"]
shader_format_spirv = ["naga/spv-in", "naga/spv-out", "wgpu/spirv"]

# For ktx2 supercompression
zlib = ["flate2"]
zstd = ["ruzstd"]

ci_limits = []
ios_simulator = []
trace = ["profiling"]
tracing-tracy = []
webgl = ["wgpu/webgl"]
webgpu = ["wgpu/webgpu"]
wgpu_trace = ["wgpu/trace"]

[dependencies]
# bevy
bevy_app = { version = "0.14.2" }
bevy_asset = { version = "0.14.2" }
bevy_color = { version = "0.14.3", features = ["serialize", "wgpu-types"] }
bevy_core = { version = "0.14.2" }
bevy_derive = { version = "0.14.2" }
bevy_diagnostic = { version = "0.14.2" }
bevy_ecs = { version = "0.14.2" }
bevy_encase_derive = { version = "0.14.2" }
bevy_hierarchy = { version = "0.14.2" }
bevy_math = { version = "0.14.2" }
bevy_mikktspace = { version = "0.14.2" }
bevy_reflect = { version = "0.14.2", features = ["bevy"] }
bevy_render_macros = { version = "0.14.2" }
bevy_tasks = { version = "0.14.2" }
bevy_time = { version = "0.14.2" }
bevy_transform = { version = "0.14.2" }
bevy_utils = { version = "0.14.2" }
bevy_window = { version = "0.14.2" }
bevy_winit = { version = "0.14.2" }

# rendering
image = { version = "0.25.2", default-features = false }

# misc
codespan-reporting = "0.11.0"
# `fragile-send-sync-non-atomic-wasm` feature means we can't use WASM threads for rendering
# It is enabled for now to avoid having to do a significant overhaul of the renderer just for wasm.
# When the 'atomics' feature is enabled `fragile-send-sync-non-atomic` does nothing
# and Bevy instead wraps `wgpu` types to verify they are not used off their origin thread.
bitflags = { version = "2.3", features = ["serde"] }
bytemuck = { version = "1.5", features = ["derive", "must_cast"] }
ddsfile = { version = "0.5.2", optional = true }
downcast-rs = "1.2.0"
futures-lite = "2.0.1"
hexasphere = "12.0"
ktx2 = { version = "0.3.0", optional = true }
naga = { version = "0.20", features = ["wgsl-in"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1.0"
wgpu = { version = "0.20", default-features = false, features = [
  "dx12",
  "fragile-send-sync-non-atomic-wasm",
  "metal",
  "naga",
  "naga-ir",
  "wgsl",
] }
# For ktx2 supercompression
flate2 = { version = "1.0.22", optional = true }
ruzstd = { version = "0.7.0", optional = true }
# For transcoding of UASTC/ETC1S universal formats, and for .basis file support
basis-universal = { version = "0.3.0", optional = true }
encase = { version = "0.8", features = ["glam"] }
# For wgpu profiling using tracing. Use `RUST_LOG=info` to also capture the wgpu spans.
async-channel = "2.2.0"
nonmax = "0.5"
profiling = { version = "1", features = [
  "profile-with-tracing",
], optional = true }
smallvec = { version = "1.11", features = ["const_new"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Omit the `glsl` feature in non-WebAssembly by default.
naga_oil = { version = "0.14", default-features = false, features = [
  "test_shader",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
naga_oil = "0.14"
wasm-bindgen = "0.2"
web-sys = { version = "0.3.67", features = [
  'Blob',
  'Document',
  'Element',
  'HtmlElement',
  'Node',
  'Url',
  'Window',
] }

[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
send_wrapper = "0.6.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "-Zunstable-options", "docsrs"]
