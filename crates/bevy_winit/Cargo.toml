[package]
description = "A winit window and input backend for Bevy Engine"
edition = "2021"
homepage = "https://bevyengine.org"
keywords = ["bevy"]
license = "MIT OR Apache-2.0"
name = "bevy_winit"
repository = "https://github.com/bevyengine/bevy"
version = "0.14.2"

[features]
accesskit_unix = ["accesskit_winit/accesskit_unix", "accesskit_winit/async-io"]
serialize = ["bevy_input/serialize", "bevy_window/serialize", "serde"]
trace = []
wayland = ["winit/wayland", "winit/wayland-csd-adwaita"]
x11 = ["winit/x11"]

[dependencies]
# bevy
bevy_a11y = { version = "0.14.2" }
bevy_app = { version = "0.14.2" }
bevy_derive = { version = "0.14.2" }
bevy_ecs = { version = "0.14.2" }
bevy_hierarchy = { version = "0.14.2" }
bevy_input = { version = "0.14.2" }
bevy_log = { version = "0.14.2" }
bevy_math = { version = "0.14.2" }
bevy_reflect = { version = "0.14.2" }
bevy_tasks = { version = "0.14.2" }
bevy_utils = { version = "0.14.2" }
bevy_window = { version = "0.14.2" }

# other
# feature rwh_06 refers to window_raw_handle@v0.6
accesskit_winit = { version = "0.20", default-features = false, features = [
  "rwh_06",
] }
approx = { version = "0.5", default-features = false }
cfg-if = "1.0"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"], optional = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", default-features = false, features = [
  "android-native-activity",
  "rwh_06",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
crossbeam-channel = "0.5"
wasm-bindgen = { version = "0.2" }
web-sys = "0.3"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "-Zunstable-options", "docsrs"]
